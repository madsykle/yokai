name: Build debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the version name/code are derived from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -e
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is not set"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/yokai.jks"

      - name: Build debug APK
        env:
          YOKAI_KEYSTORE: ${{ runner.temp }}/yokai.jks
          YOKAI_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          YOKAI_KEY_ALIAS: ${{ secrets.ALIAS }}
          YOKAI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Verify APK signature
        run: |
          set -e
          apk="app/build/outputs/apk/standard/debug/app-standard-universal-debug.apk"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee signature.txt
          # SHA-256 of the personal signing cert, as printed by apksigner (lowercase, no colons).
          grep -q "487fc4c441c872656010c618c0cdf09fa8b49d1d14348154963013a307156b35" signature.txt
          grep -q "CN=madsykle" signature.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: yokai-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
